# Pages CMS (https://app.pagescms.org): what the gaffe team edits. Every save rebuilds the site (build.mjs).
media:
  input: img
  output: img
content:
  - name: projetos
    label: Projetos
    type: file
    path: content/projetos.json
    format: json
    list: true
    description: A ordem aqui é a ordem no site. Arrasta para reordenar.
    fields:
      - name: nome
        label: 'Nome (como aparece na lista, ex.: RUA.)'
        type: string
        required: true
      - name: endereco
        label: Endereço da página
        type: string
        description: 'Só minúsculas, números e hífens. Fica no link: …/#endereco. Não mudar nos 3 projetos que já existem.'
        required: true
        pattern: ^[a-z0-9-]+$
      - name: frase
        label: Frase da lista
        type: string
      - name: setor
        label: Setor / tipo de trabalho (texto pequeno à direita)
        type: string
      - name: estado
        label: Estado
        type: select
        options:
          values:
            - value: publicado
              label: Publicado (com página)
            - value: brevemente
              label: Em breve (sem link)
      - name: preview
        label: Imagem que aparece ao passar o rato
        type: object
        fields:
          - name: imagem
            label: Imagem
            type: image
          - name: fundo
            label: Cor de fundo
            type: select
            options:
              values:
                - value: amarelo
                  label: Amarelo
                - value: vermelho
                  label: Vermelho
                - value: azul
                  label: Azul
                - value: preto
                  label: Preto
                - value: agua
                  label: Verde-água
                - value: branco
                  label: Branco
          - name: ajuste
            label: Ajuste da imagem
            type: select
            options:
              values:
                - value: cobrir
                  label: Encher o cartão
                - value: centrar
                  label: Centrada (logos)
          - name: rodar
            label: A rodar
            type: boolean
      - name: cabecalho
        label: Página do projeto – topo
        type: object
        description: 'Só para projetos novos. ARA, Sanjo e AQUAINN têm o topo feito à medida, editável nas entradas "Case: …".'
        fields:
          - name: subtitulo
            label: Frase por baixo do nome
            type: text
          - name: imagem
            label: Imagem ao lado do nome
            type: image
          - name: cliente
            label: Cliente
            type: string
          - name: setor
            label: Setor
            type: string
          - name: fizemos
            label: O que fizemos
            type: text
          - name: formato
            label: Formato
            type: string
      - name: blocos
        label: Página do projeto – blocos
        type: block
        description: 'Nos projetos novos, os blocos são a página toda. Em ARA, Sanjo e AQUAINN entram no fim da página, antes do bloco amarelo. Carrega em + para juntar blocos; arrasta para mudar a ordem. Dicas: ==palavra== sublinha a amarelo, ~~palavra~~ risca a vermelho, **palavra** fica a negrito. Enter muda de linha.'
        list: true
        blockKey: tipo
        blocks:
          - name: secao
            label: Secção com título grande (the question?, the insight.)
            fields:
              - name: titulo
                label: Título grande (Enter para partir a linha)
                type: text
              - name: destaque
                label: Frase em destaque
                type: text
              - name: texto
                label: Texto (linha em branco = novo parágrafo)
                type: text
              - name: fundo
                label: Fundo
                type: select
                options:
                  values:
                    - value: branco
                      label: Branco
                    - value: amarelo
                      label: Amarelo
                    - value: azul
                      label: Azul
          - name: obvio
            label: Óbvio vs gaffe
            fields:
              - name: obvio
                label: A resposta óbvia (aparece riscada)
                type: text
              - name: gaffe
                label: A gaffe (a resposta deles, em grande)
                type: text
              - name: titulo_obvio
                label: Título da resposta óbvia (vazio = o de sempre)
                type: text
              - name: titulo_gaffe
                label: Título da gaffe (vazio = o de sempre)
                type: text
          - name: citacao
            label: Citação grande
            fields:
              - name: texto
                label: Citação
                type: text
              - name: traducao
                label: Tradução ou nota (pequena, por baixo)
                type: text
          - name: numeros
            label: Números em destaque
            fields:
              - name: itens
                label: Números
                type: object
                list: true
                fields:
                  - name: numero
                    label: 'Número (ex.: 800 L)'
                    type: string
                  - name: texto
                    label: Explicação
                    type: string
          - name: texto
            label: Texto simples
            fields:
              - name: texto
                label: Texto (linha em branco = novo parágrafo)
                type: text
          - name: imagem
            label: Imagem
            fields:
              - name: imagem
                label: Imagem
                type: image
              - name: legenda
                label: Legenda
                type: string
              - name: largura
                label: Largura
                type: select
                options:
                  values:
                    - value: inteira
                      label: Largura toda
                    - value: normal
                      label: Mais estreita
          - name: galeria
            label: Galeria de imagens
            fields:
              - name: imagens
                label: Imagens
                type: object
                list: true
                fields:
                  - name: imagem
                    label: Imagem
                    type: image
                  - name: legenda
                    label: Legenda
                    type: string
