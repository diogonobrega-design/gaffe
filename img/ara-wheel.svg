<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- the ARA wheel, as a file so the projects list can use it like any other preview image -->
  <g fill="none" stroke="#0a0a0a" stroke-width="5">
    <line x1="200" y1="200" x2="200" y2="22"/>
    <line x1="200" y1="200" x2="200" y2="22" transform="rotate(60 200 200)"/>
    <line x1="200" y1="200" x2="200" y2="22" transform="rotate(90 200 200)"/>
    <line x1="200" y1="200" x2="200" y2="22" transform="rotate(120 200 200)"/>
    <line x1="200" y1="200" x2="200" y2="22" transform="rotate(150 200 200)"/>
    <line x1="200" y1="200" x2="200" y2="22" transform="rotate(180 200 200)"/>
    <line x1="200" y1="200" x2="200" y2="22" transform="rotate(210 200 200)"/>
    <line x1="200" y1="200" x2="200" y2="22" transform="rotate(240 200 200)"/>
    <line x1="200" y1="200" x2="200" y2="22" transform="rotate(270 200 200)"/>
    <line x1="200" y1="200" x2="200" y2="22" transform="rotate(300 200 200)"/>
    <line x1="200" y1="200" x2="200" y2="22" transform="rotate(330 200 200)"/>
    <circle cx="200" cy="200" r="180" stroke-width="14"/>
    <line x1="200" y1="200" x2="200" y2="27" stroke-width="14" stroke="#E5343C" transform="rotate(30 200 200)"/>
  </g>
  <circle cx="200" cy="200" r="30" fill="#0a0a0a"/>
</svg>
